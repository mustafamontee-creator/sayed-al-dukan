name: Build XXX Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - xxx-manager-app
    paths:
      - 'XXX/**'
      - '.github/workflows/build-xxx-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: xxx-manager-app
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        working-directory: XXX
        run: flutter create --platforms=android .
      - name: Install dependencies
        working-directory: XXX
        run: flutter pub get
      - name: Analyze (informational)
        working-directory: XXX
        run: flutter analyze || true
      - name: Build APK
        working-directory: XXX
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XXX-manager-apk
          path: XXX/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
