name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pro-ui-refresh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Verify original intro video
        run: |
          test -s assets/animation/dukan_9x16_4k.mp4

      - name: Generate Android project
        run: bash setup.sh

      - name: Analyze, test and build signed APK
        env:
          SUPABASE_URL: https://vusjswnvqbxspdgbekxc.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_-FnAVg38wgT94t6kbSuT3A_mqmgs5mz' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: sayed-al-dukan-release
        run: bash build_apk.sh

