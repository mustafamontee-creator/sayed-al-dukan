name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Generate Android project
        run: bash setup.sh

      - name: Analyze, test and build signed APK
        env:
          SUPABASE_URL: https://vusjswnvqbxspdgbekxc.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_-FnAVg38wgT94t6kbSuT3A_mqmgs5mz' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: sayed-al-dukan-release
        run: bash build_apk.sh

      - name: Read update manifest
        id: update
        run: |
          VERSION_NAME="$(jq -r '.version_name' app-update.json)"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sayed-al-dukan-android-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/feature/pro-ui-refresh'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.update.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          name: Sayed Al-Dukan ${{ steps.update.outputs.version_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true

      - name: Notify subscribed users about the published update
        if: github.ref == 'refs/heads/feature/pro-ui-refresh'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not configured; update push was skipped."
            exit 0
          fi
          MANIFEST="$(cat app-update.json)"
          PAYLOAD="$(printf '%s' "$MANIFEST" | jq -c '{
            version_name: .version_name,
            version_code: .version_code,
            title_ar: .title_ar,
            description_ar: .description_ar,
            description_en: .description_en
          }')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://vusjswnvqbxspdgbekxc.supabase.co/functions/v1/send-app-update" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD"
