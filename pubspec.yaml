name: sayed_al_dukan
description: سيد الدكان - تطبيق العملاء (SAYED AL-DUKAN customer app)
publish_to: 'none'
version: 1.0.19+20
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  geolocator: ^13.0.2
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  flutter_local_notifications: ^19.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/images/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#4E759C"
  adaptive_icon_foreground: assets/icon/app_icon.png
